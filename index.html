<style>
/* Layout: the library is a detective's ruled notebook of numbered case files;
   the reader is a picture stage with the story on a parchment card, as in the printed book. */
:root {
  --paper: #F4F7FA;
  --rule: #DAE3ED;
  --margin: #E6A59C;
  --surface: #FFFFFF;
  --line: #C8D3E0;
  --ink: #1C2F4D;
  --ink-soft: #4C5D77;
  --barn: #B2382A;
  --on-barn: #FFFFFF;
  --field: #2E7638;
  --wrong: #B2382A;
  --straw: #F0CF6E;
  --stage: #E3E9F0;
  --panel: rgba(246, 230, 176, 0.93);
  --panel-ink: #221B0C;
  --shadow: 0 1px 2px rgba(28, 47, 77, .10), 0 10px 28px rgba(28, 47, 77, .14);
  --font-display: "Bree Serif", Rockwell, "Roboto Slab", Georgia, serif;
  --font-read: "Andika", Verdana, "Trebuchet MS", system-ui, sans-serif;
  --font-note: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1828; --rule: #19253A; --margin: rgba(230, 165, 156, .30);
    --surface: #16213A; --line: #293956;
    --ink: #E6ECF5; --ink-soft: #A5B3C8;
    --barn: #E66B58; --on-barn: #1B0C08;
    --field: #73C580; --wrong: #F28C7C; --straw: #E8C75F;
    --stage: #090F1A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1828; --rule: #19253A; --margin: rgba(230, 165, 156, .30);
  --surface: #16213A; --line: #293956;
  --ink: #E6ECF5; --ink-soft: #A5B3C8;
  --barn: #E66B58; --on-barn: #1B0C08;
  --field: #73C580; --wrong: #F28C7C; --straw: #E8C75F;
  --stage: #090F1A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}

/* ---------- base ---------- */
html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-read); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body.mode-read { height: 100%; overflow: hidden; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--barn); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.note { font-family: var(--font-note); letter-spacing: .02em; }
#app { min-height: 100%; }
body.mode-read #app { height: 100%; }

/* notebook ruling, shared by the library and the quiz */
.ruled {
  background-color: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px);
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  min-height: 48px; padding: 0 1.3em; border-radius: 999px;
  font-family: var(--font-read); font-weight: 700; font-size: 1.05rem;
  border: 2px solid var(--ink); background: transparent; color: var(--ink);
  cursor: pointer; text-decoration: none;
}
.btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.btn.primary { background: var(--barn); border-color: var(--barn); color: var(--on-barn); }
.btn.primary:hover { background: color-mix(in srgb, var(--barn) 88%, var(--ink)); }
.btn svg { width: 1.15em; height: 1.15em; flex: none; }

.lang {
  display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--line); flex: none;
}
.lang button {
  border: 0; background: transparent; cursor: pointer; border-radius: 999px;
  min-height: 38px; padding: 0 .9em; font-weight: 700; font-size: .95rem; color: var(--ink-soft);
}
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lang .short { display: none; }

/* ---------- library ---------- */
.lib { max-width: 1180px; margin: 0 auto; padding: 28px 16px 40px; position: relative; display: grid; gap: 28px; align-content: start; min-height: 100vh; min-height: 100dvh; }
@media (min-width: 720px) {
  .lib { padding-left: 76px; padding-right: 32px; padding-block: 44px 56px; }
  .lib::before { content: ""; position: absolute; top: 0; bottom: 0; left: 46px; width: 2px; background: var(--margin); }
}
.lib-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand svg { width: clamp(52px, 9vw, 76px); height: auto; flex: none; }
.brand .eyebrow { margin: 0; color: var(--barn); font-size: clamp(1.05rem, 2.6vw, 1.35rem); line-height: 1.1; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400; line-height: 1.02;
  font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -.01em; text-wrap: balance;
}
.intro { margin: 0; max-width: 40rem; font-size: clamp(1.08rem, 2.4vw, 1.25rem); color: var(--ink-soft); }
.intro strong { color: var(--ink); font-weight: 700; }

.cases { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.case {
  display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center;
  width: 100%; text-align: left; padding: 0; border: 0; background: none; color: inherit; font: inherit;
}
button.case { cursor: pointer; }
.case-cover { position: relative; display: block; }
.case-cover img {
  display: block; width: 100%; height: auto; aspect-ratio: 836 / 941; object-fit: cover;
  border-radius: 3px 6px 6px 3px; box-shadow: var(--shadow); background: var(--stage);
}
.case.soon .case-cover img { filter: saturate(.5); opacity: .8; }
.case-no {
  position: absolute; top: -9px; left: -7px; padding: 1px 9px 0;
  background: var(--straw); color: #2A2208; font-size: 1.05rem; line-height: 1.5;
  transform: rotate(-4deg); box-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.case-meta { display: grid; gap: 4px; min-width: 0; justify-items: start; }
.case-title { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.15; text-wrap: balance; }
.case-topic { color: var(--ink-soft); font-size: .98rem; }
.chip {
  margin-top: 6px; display: inline-flex; align-items: center; gap: .35em;
  border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: .92rem; line-height: 1.3;
}
.chip.go { background: var(--barn); color: var(--on-barn); }
.chip.wait { border: 1.5px dashed var(--ink-soft); color: var(--ink-soft); }
.chip svg { width: 1em; height: 1em; }
button.case:hover .case-cover img { transform: translateY(-3px) rotate(-.6deg); }
.case-cover img { transition: transform .2s ease; }

@media (min-width: 640px) {
  .cases { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 28px; }
  .case { grid-template-columns: 1fr; align-items: start; gap: 14px; }
  .case-no { top: -11px; left: -9px; font-size: 1.15rem; }
}
@media (min-width: 980px) {
  .cases { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px; }
}
.lib-foot { display: grid; gap: 4px; color: var(--ink-soft); font-size: .92rem; border-top: 1.5px solid var(--line); padding-top: 16px; }
.lib-foot p { margin: 0; }

/* ---------- reader shell ---------- */
.reader { height: 100%; display: flex; flex-direction: column; background: var(--stage); }
.r-bar {
  flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 56px;
  background: var(--surface); border-bottom: 1.5px solid var(--line);
}
.icon-btn {
  display: inline-flex; align-items: center; gap: .35em; min-height: 44px; min-width: 44px; justify-content: center;
  border: 0; background: transparent; border-radius: 999px; padding: 0 .7em; cursor: pointer; font-weight: 700; color: var(--ink);
}
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn svg { width: 22px; height: 22px; flex: none; }
.r-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: .5em; overflow: hidden; }
.r-title .note { color: var(--barn); font-size: 1.1rem; flex: none; }
.r-title b { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-main { flex: 1; min-height: 0; position: relative; }
.r-main > .view { position: absolute; inset: 0; }
.r-nav {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; min-height: 64px; background: var(--surface); border-top: 1.5px solid var(--line);
}
.r-nav .btn { min-height: 46px; padding: 0 1em; }
.r-nav .btn[disabled] { opacity: .35; cursor: default; }
.r-nav .ghost { visibility: hidden; }
.nav-mid { display: flex; align-items: center; gap: 12px; min-width: 0; }
.dots { display: flex; align-items: center; gap: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dots i.done { background: var(--ink-soft); }
.dots i.on { background: var(--barn); transform: scale(1.35); }
.dots i.q { border-radius: 2px; transform: rotate(45deg); }
.dots i.q.on { transform: rotate(45deg) scale(1.35); }
.listen { border: 2px solid var(--ink); }
.listen[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
@media (max-width: 459px) {
  .r-nav .btn .lbl, .icon-btn .lbl { display: none; }
  .r-nav .btn { padding: 0; width: 48px; }
  .lang .long { display: none; } .lang .short { display: inline; }
  .r-title .note { display: none; }
}
@media (max-width: 719px) { .reader .lang .long { display: none; } .reader .lang .short { display: inline; } }

/* ---------- story page ---------- */
.page { overflow-y: auto; background: var(--paper); }
.stage { display: flex; flex-direction: column; }
.art { margin: 0; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: var(--stage); flex: none; }
.art img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus, 50%) 50%; animation: show .35s ease; }
@media (min-width: 600px) { .art { aspect-ratio: 16 / 9; } .art img { object-position: 50% 50%; } }
.story { padding: 20px 20px 28px; font-size: clamp(1.15rem, 4.6vw, 1.45rem); line-height: 1.55; max-width: 44rem; margin: 0 auto; width: 100%; }
.story p { margin: 0 0 .5em; }
.story p:last-child { margin-bottom: 0; }
.story strong { font-weight: 700; }
.story ul { margin: 0 0 .5em; padding-left: 1.25em; text-align: left; }
.story li { margin: .15em 0; }
@keyframes show { from { opacity: .25; } to { opacity: 1; } }

/* wide screens: the story card sits on the picture, like the printed page */
@media (orientation: landscape) and (min-width: 720px) and (min-height: 561px) {
  .page { overflow: hidden; display: grid; place-items: center; container-type: size; background: var(--stage); }
  .stage {
    display: block; position: relative; container-type: inline-size;
    width: min(calc(100cqw - 32px), calc((100cqh - 32px) * 16 / 9)); aspect-ratio: 16 / 9;
    border-radius: 6px; overflow: hidden; box-shadow: var(--shadow);
  }
  .art { position: absolute; inset: 0; aspect-ratio: auto; }
  .art img { object-position: 50% 50%; }
  .story {
    position: absolute; top: 50%; left: 3.4%; transform: translateY(-50%);
    width: 41%; max-height: 88%; overflow-y: auto; margin: 0;
    background: var(--panel); color: var(--panel-ink);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    border-radius: .5cqw; box-shadow: 0 2px 14px rgba(40, 28, 0, .22);
    padding: 2.8cqw 2.6cqw; text-align: center;
    font-size: clamp(15px, 1.85cqw, 30px); line-height: 1.42;
  }
  .story.right { left: auto; right: 3.4%; }
  .story ul { display: inline-block; }
}
/* phones turned sideways: picture on the left, story on the right */
@media (orientation: landscape) and (max-height: 560px) {
  .page { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); overflow: hidden; }
  .stage { display: contents; }
  .art { aspect-ratio: auto; height: 100%; }
  .art img { object-position: var(--focus, 50%) 50%; }
  .story { overflow-y: auto; margin: 0; padding: 14px 18px; font-size: 1.08rem; line-height: 1.5; align-self: stretch; }
  .r-bar { min-height: 46px; padding-block: 2px; }
  .r-nav { min-height: 52px; padding-block: 4px; }
  .r-nav .btn { min-height: 42px; }
}

/* ---------- cover page ---------- */
.cover { overflow-y: auto; background: var(--paper); container-type: size; }
.cover-in { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 22px 20px 28px; }
.cover-art img { display: block; max-height: 46cqh; width: auto; height: auto; border-radius: 3px 7px 7px 3px; box-shadow: var(--shadow); }
.cover-info { max-width: 32rem; display: grid; gap: 10px; justify-items: center; text-align: center; }
.cover-info .note { margin: 0; color: var(--barn); font-size: 1.2rem; }
.cover-info h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.05; text-wrap: balance; }
.cover-info .blurb { margin: 0; font-size: 1.12rem; color: var(--ink-soft); }
.cover-info .btn { margin-top: 8px; }
.cover-info .hint { margin: 2px 0 0; font-size: .9rem; color: var(--ink-soft); }
@media (orientation: landscape) and (min-width: 720px) {
  .cover-in { flex-direction: row; gap: clamp(28px, 5vw, 72px); padding: 24px 40px; }
  .cover-art img { max-height: 84cqh; max-width: 44cqw; }
  .cover-info { justify-items: start; text-align: left; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .cover-in { flex-direction: row; gap: 24px; padding: 12px 24px; }
  .cover-art img { max-height: 88cqh; }
  .cover-info { justify-items: start; text-align: left; gap: 6px; }
  .cover-info h2 { font-size: 1.9rem; }
  .cover-info .blurb { font-size: .98rem; }
}

/* ---------- quiz ---------- */
.quiz { overflow-y: auto; }
.quiz-in { max-width: 40rem; margin: 0 auto; padding: 28px 18px 36px; display: grid; gap: 16px; }
.quiz .note { margin: 0; color: var(--barn); font-size: 1.2rem; }
.quiz h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.55rem, 5vw, 2.1rem); line-height: 1.15; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 36px 1fr 24px; align-items: center; gap: 12px; text-align: left;
  min-height: 60px; padding: 10px 14px; border-radius: 14px; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); font-size: 1.15rem; line-height: 1.3; color: var(--ink);
}
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt .k {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--paper); border: 2px solid var(--line); font-weight: 700; font-size: 1rem;
}
.opt .mark svg { width: 24px; height: 24px; display: block; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--field); background: color-mix(in srgb, var(--field) 12%, var(--surface)); }
.opt.right .k { background: var(--field); border-color: var(--field); color: var(--surface); }
.opt.right .mark { color: var(--field); }
.opt.miss { border-color: var(--wrong); background: color-mix(in srgb, var(--wrong) 10%, var(--surface)); }
.opt.miss .k { background: var(--wrong); border-color: var(--wrong); color: var(--surface); }
.opt.miss .mark { color: var(--wrong); }
.opt.dim { opacity: .55; }
.feedback { display: grid; gap: 4px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border-left: 6px solid var(--field); font-size: 1.08rem; }
.feedback.miss { border-left-color: var(--wrong); }
.feedback b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; }
.feedback p { margin: 0; }
.quiz-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.result { text-align: center; justify-items: center; }
.result svg.badge { width: 132px; height: 132px; }
.result .score { margin: 0; font-size: 1.3rem; }
.result .msg { margin: 0; color: var(--ink-soft); font-size: 1.1rem; }
.result .quiz-actions { justify-content: center; }

/* ---------- printed page (the finished page with text inside the picture) ---------- */
.view-switch .vlbl { margin-left: .35em; }
.view-switch button { display: inline-flex; align-items: center; }
.view-switch svg { width: 20px; height: 20px; flex: none; }
@media (max-width: 899px) { .view-switch .vlbl { display: none; } .view-switch button { padding: 0 .7em; } }
.page.printed {
  display: grid; place-content: center; justify-items: center; gap: 12px;
  grid-template-columns: none; overflow: hidden; container-type: size; background: var(--stage);
}
.page.printed .stage {
  display: block; position: relative; container-type: normal;
  width: min(calc(100cqw - 24px), calc((100cqh - 24px) * 16 / 9)); aspect-ratio: 16 / 9;
  border-radius: 6px; overflow: hidden; box-shadow: var(--shadow);
}
.page.printed .art { position: absolute; inset: 0; aspect-ratio: auto; height: auto; }
.page.printed .art img { object-fit: contain; object-position: 50% 50%; }
.print-hint { display: none; margin: 0 16px; text-align: center; color: var(--ink-soft); font-size: 1rem; }
.print-hint button {
  border: 0; background: none; padding: 0; cursor: pointer; font-weight: 700; color: var(--barn);
  text-decoration: underline; text-underline-offset: 3px;
}
@media (orientation: portrait), (max-width: 719px), (max-height: 560px) {
  .print-hint { display: block; }
  .page.printed .stage { width: min(calc(100cqw - 16px), calc((100cqh - 72px) * 16 / 9)); }
}

.load-error { padding: 24px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

</head>
<body>
<div id="app" aria-live="off"></div>
<p id="announce" class="sr-only" aria-live="polite"></p>
<noscript><p style="padding:24px">Please turn on JavaScript to read the Germ Detectives books.</p></noscript>

<script src="books.js"></script>
<script>
(function () {
  "use strict";
  var DATA = window.GERM_DETECTIVES;
  var app = document.getElementById("app");
  var announcer = document.getElementById("announce");
  if (!DATA) {
    app.innerHTML = '<p class="load-error">The book list (books.js) did not load. Check that books.js sits next to index.html.</p>';
    return;
  }

  /* ---------- words used by the app itself ---------- */
  var T = {
    en: {
      language: "Language", turn: "Turn pages", library: "Library", backToLib: "Back to library",
      intro: "Picture books about germs, health, and safety. <strong>Every story can be read in English or Spanish.</strong> Pick a case to start reading.",
      caseWord: "Case", read: "Read the book", soon: "Coming soon",
      adventure: "A Germ Detectives Adventure", start: "Start reading",
      hint: "Swipe, or use the arrow keys, to turn the page.",
      prev: "Back", next: "Next", toQuiz: "Detective Check",
      listen: "Listen", pause: "Pause", noAudio: "No recording for this page yet",
      cover: "Cover", pageOf: function (i, n) { return "Page " + i + " of " + n; },
      quizTitle: "Detective Check", qOf: function (i, n) { return "Question " + i + " of " + n; },
      right: "That’s right!", wrong: "Not quite.", answerWas: "The answer is: ",

  /* ---------- state ---------- */

  var wideScreen = window.matchMedia ? window.matchMedia("(orientation: landscape) and (min-width: 720px) and (min-height: 561px)") : { matches: true };
  var audio = new Audio();
  audio.preload = "none";

  function L(obj) { return obj ? (obj[state.lang] || obj.en || "") : ""; }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/_([^_]+)_/g, "<em>$1</em>");
  }

    var out = [], list = [];
    String(text || "").split("\n").forEach(function (raw) {
      var line = raw.trim();
      if (/^- /.test(line)) { list.push("<li>" + inline(line.slice(2)) + "</li>"); return; }
      if (list.length) { out.push("<ul>" + list.join("") + "</ul>"); list = []; }
      if (line) out.push("<p>" + inline(line) + "</p>");
    });
    if (list.length) out.push("<ul>" + list.join("") + "</ul>");
    return out.join("");
  }

  /* ---------- address bar (lets teachers share a link to a book or language) ---------- */
  function readHash() {
    var parts = (location.hash || "").replace(/^#/, "").split("-").filter(Boolean);
    var out = { lang: null, book: null, page: 0 };
    parts.forEach(function (p) {
      if (p === "en" || p === "es") out.lang = p;
      else if (/^p\d+$/.test(p)) out.page = parseInt(p.slice(1), 10);
      else {
        var b = DATA.books.filter(function (x) { return x.id === p && x.ready; })[0];
        if (b) out.book = b;
      }
    });
    return out;
  }
  function writeHash(push) {
    var parts = [];

    }
    if (state.lang === "es") parts.push("es");
    var url = location.pathname + location.search + (parts.length ? "#" + parts.join("-") : "");

  function langSwitch() {

  /* ---------- reader ---------- */
  function openBook(id, page, push) {
    var b = DATA.books.filter(function (x) { return x.id === id && x.ready; })[0];
    if (!b) { renderLibrary(); return; }
    state.view = "reader";
    state.book = b;
    state.page = Math.max(0, Math.min(page || 0, totalPages(b) - 1));
    state.quiz = null;
    writeHash(push);
    renderReader();
  }

    var b = state.book;

      '<div class="reader">' +
        '<header class="r-bar">' +

  function setMode(m) {

  function renderPage(announce, keepAudio) {

  function updateNav() {

  /* ---------- narration ---------- */
  function audioSrc() { return "audio/" + state.book.id + "/" + state.lang + "/page-" + state.page + ".mp3"; }
  function setListenUI(playing) {
    var btn = app.querySelector("#listen");
    if (!btn) return;
    btn.setAttribute("aria-pressed", playing ? "true" : "false");
    btn.innerHTML = (playing ? I.pause : I.speaker) + '<span class="lbl">' + (playing ? t("pause") : t("listen")) + "</span>";
    btn.setAttribute("aria-label", playing ? t("pause") : t("listen"));
  }
  function stopAudio() {
    try { audio.pause(); } catch (e) {}
    setListenUI(false);
  }

    state.listening = true;
    playCurrent();
  }
  function playIfListening() {
    stopAudio();
    if (state.listening && state.view === "reader" && kindOf(state.book, state.page) !== "quiz") playCurrent();
  }
  function playCurrent() {
    var btn = app.querySelector("#listen");
    if (!btn || btn.hidden) return;
    audio.src = audioSrc();
    var pr = audio.play();
    setListenUI(true);
    if (pr && pr.catch) pr.catch(function () { setListenUI(false); });
  }
  audio.addEventListener("ended", function () { setListenUI(false); });
  audio.addEventListener("error", function () {
    setListenUI(false);
    var btn = app.querySelector("#listen");
    if (btn && !btn.hidden) { btn.disabled = true; btn.title = t("noAudio"); }
  });

  /* ---------- quiz ---------- */
  function renderQuiz() {
    var b = state.book, q = state.quiz, box = app.querySelector("#quizIn");

      var msg = q.score === n ? t("perfect") : q.score >= n - 2 ? t("good") : t("more");
      box.className = "quiz-in result";
      box.innerHTML = I.badge +
        "<h2>" + (q.score >= n - 2 ? t("solved") : t("goodTry")) + "</h2>" +
        '<p class="score">' + t("score")(q.score, n) + "</p>" +
        '<p class="msg">' + msg + "</p>" +
        '<div class="quiz-actions">' +
          '<button type="button" class="btn primary" id="qAgain">' + t("tryAgain") + "</button>" +
          '<button type="button" class="btn" id="qRead">' + t("readAgain") + "</button>" +
          '<button type="button" class="btn" id="qLib">' + t("backToLib") + "</button>" +
        "</div>";
      box.querySelector("#qAgain").addEventListener("click", function () { state.quiz = { i: 0, picked: null, score: 0, done: false }; renderQuiz(); focusQuiz(); });
      box.querySelector("#qRead").addEventListener("click", function () { go(0); });
      box.querySelector("#qLib").addEventListener("click", goLibrary);
      return;
    }
    var item = b.quiz[q.i], answered = q.picked !== null;
    var opts = item.options.map(function (o, i) {
      var cls = "opt";
      var mark = "";
      if (answered) {
        if (i === item.answer) { cls += " right"; mark = I.check; }
        else if (i === q.picked) { cls += " miss"; mark = I.cross; }
        else cls += " dim";
      }
      return '<button type="button" class="' + cls + '" data-opt="' + i + '"' + (answered ? " disabled" : "") + ">" +
        '<span class="k">' + "ABCD".charAt(i) + "</span><span>" + inline(L(o)) + '</span><span class="mark">' + mark + "</span></button>";
    }).join("");
    var good = answered && q.picked === item.answer;
    box.className = "quiz-in";
    box.innerHTML =
      '<p class="note">' + t("quizTitle") + " · " + t("qOf")(q.i + 1, n) + "</p>" +
      '<h2 id="qText">' + inline(L(item.q)) + "</h2>" +
      '<div class="opts" role="group" aria-labelledby="qText">' + opts + "</div>" +
      (answered
        ? '<div class="feedback' + (good ? "" : " miss") + '" role="status"><b>' + (good ? t("right") : t("wrong")) + "</b>" +
            (good ? "" : "<p>" + t("answerWas") + "<strong>" + inline(L(item.options[item.answer])) + "</strong></p>") +
            "<p>" + inline(L(item.why)) + "</p></div>" +
          '<div class="quiz-actions"><button type="button" class="btn primary" id="qNext">' + (q.i + 1 < n ? t("nextQ") : t("finish")) + I.next + "</button></div>"
        : "");
    box.querySelectorAll("[data-opt]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (q.picked !== null) return;
        q.picked = parseInt(el.dataset.opt, 10);
        if (q.picked === item.answer) q.score++;
        renderQuiz();
        var nx = box.querySelector("#qNext"); if (nx) nx.focus();
      });
    });
    var nx = box.querySelector("#qNext");
    if (nx) nx.addEventListener("click", function () {
      if (q.i + 1 < n) { q.i++; q.picked = null; } else { q.done = true; }
      renderQuiz(); focusQuiz();
    });
  }
  function focusQuiz() {
    var first = app.querySelector("#quizIn button");
    var sec = app.querySelector(".quiz");
    if (sec) sec.scrollTop = 0;
    if (first) first.focus();
  }

  /* ---------- swipe and keys ---------- */
  function bindSwipe(el) {
    var sx = 0, sy = 0, active = false;
    el.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse") return;
      active = true; sx = e.clientX; sy = e.clientY;
    });
    el.addEventListener("pointerup", function (e) {
      if (!active) return;
      active = false;
      if (kindOf(state.book, state.page) === "quiz") return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(state.page + (dx < 0 ? 1 : -1));
    });
    el.addEventListener("pointercancel", function () { active = false; });
  }
  document.addEventListener("keydown", function (e) {
    if (state.view !== "reader" || e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") { go(state.page + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { go(state.page - 1); e.preventDefault(); }
    else if (e.key === "Escape") goLibrary();
  });
  window.addEventListener("popstate", route);
  window.addEventListener("hashchange", route);

  function route() {
    var h = readHash();
    if (h.lang && h.lang !== state.lang) { state.lang = h.lang; document.documentElement.lang = h.lang; }
    if (h.book) {
      if (state.view === "reader" && state.book === h.book) {
        if (h.page !== state.page) { state.page = Math.min(h.page, totalPages(h.book) - 1); if (kindOf(h.book, state.page) === "quiz") state.quiz = { i: 0, picked: null, score: 0, done: false }; renderPage(true); }
      } else {
        openBook(h.book.id, h.page, false);
      }
    } else if (state.view !== "library") {
      renderLibrary();
    }
  }

  /* ---------- start ---------- */
  (function start() {
    var h = readHash();
    var saved = recall("gd-lang");
    var savedView = recall("gd-view");
    if (savedView === "print" || savedView === "text") state.mode = savedView;
    var nav = (navigator.language || "en").toLowerCase();
    state.lang = h.lang || (saved === "es" || saved === "en" ? saved : (nav.indexOf("es") === 0 ? "es" : "en"));
    document.documentElement.lang = state.lang;
    if (h.book) openBook(h.book.id, h.page, false); else renderLibrary();
  })();
})();
</script>

</body>
</html>
